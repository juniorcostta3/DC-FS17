<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 04 - Formulário</title>
</head>
<body>
    <form>
        <label for="nome">Nome: </label>
        <input type="text" id="nome">
        <br>
        <label for="senha">Senha: </label>
        <input type="password" id="senha">
        <br>
        <label for="">Pergunta para as opções abaixo com radio: </label>
        <br>

        <input type="radio" name="grupo" id="um" value="op1">
        <label for="um">Opção 01</label>
        <br>

        <input type="radio" name="grupo" id="dois" value="op2">
        <label for="dois">Opção 02</label>
        <br>

        <input type="radio" name="grupo" id="tres" value="op3">
        <label for="tres">Opção 03</label>
        <br>

        <input type="radio" name="grupo" id="quatro" value="op4">
        <label for="quatro">Opção 04</label>
        <br>

        <label for="">Pergunta para as opções abaixo com checkbox: </label>
        <br>
        
        <input type="checkbox" name="grupo" id="um1" value="op1">
        <label for="um1">Opção 01</label>
        <br>

        <input type="checkbox" name="grupo" id="dois2" value="op2">
        <label for="dois2">Opção 02</label>
        <br>

        <input type="checkbox" name="grupo" id="tres3" value="op3">
        <label for="tres3">Opção 03</label>
        <br>

        <input type="checkbox" name="grupo" id="quatro4" value="op4">
        <label for="quatro4">Opção 04</label>
        <br>

        <select name="" id="">

            <label for="estado">Estado</label>

            <option value="padrao">Padrão</option>
            <option value="AM">AM</option>
            <option value="PB">PB</option>
            <option value="CE">CE</option>
            <option value="PE" disabled>PE</option>

        </select>
        <br>

        <label for="campoTexto">Faça um comentário</label>
        <br>
        <textarea name="campoTexto" id="campoTexto" cols="60" rows="20" maxlength="20"></textarea>
    </form>
</body>
</html>
