<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 04</title>
</head>
<body>
    <h2>Atividade de formulário</h2>

    <form action="#">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" value="" placeholder="Digite o nome">
        <br>
        <label for="email">Email: </label>
        <input type="email" id="email" value="" placeholder="Digite o email">
        <br>
        <label for="data">Data de nascimento: </label>
        <input type="date" id="data" value="#" placeholder="Digite a data de nascimento">
        <br>
        <label for="horario">Horário de agendamoento: </label>
        <input type="time" id="horario" value="#" placeholder="Digite o horário desejado">
        <br>
        <label for="endereco">Endereço: </label>
        <input type="text" id="endereco" value="" placeholder="Digite o seu endereço">
        <br>
        <input type="submit" value="Enviar formulário">
    </form>
</body>
</html>
